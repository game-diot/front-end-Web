<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择器集合</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="main-container">
        <h1>Custom Web Pickers</h1>
        <div class="picker-container">

            <!-- Color Picker -->
            <label>Color Picker:</label>
            <div class="color-container">
                <input type="color" id="colorPicker" class="custom-input">
                <input type="text" id="colorCode" placeholder="HEX / RGB / HSL">
                <select class="custom-input" id="colorFormat">
                    <option value="hex">HEX</option>
                    <option value="rgb">RGB</option>
                    <option value="hsl">HSL</option>
                </select>
            </div>
        </div>
        <div class="picker-container">

            <!-- Number Picker -->
            <label>Number Picker:</label>
            <div class="number-container">
                <button class="number-control custom-input" onclick="numberInput.stepDown()">-</button>
                <input class="custom-input" type="number" value="1" name="numberInput" id="numberInput">
                <button class="number-control custom-input" onclick="numberInput.stepUp()">+</button>
            </div>
        </div>
        <div class="picker-container">

            <!-- Range Picker -->
            <label>Range Picker:</label>
            <div class="range-container">
                <input type="range" class="custom-input" min="0" max="100" value="50" id="rangeInput">
                <span class="range-value" id="rangeValue">50</span>
            </div>
        </div>
        <div class="picker-container">

            <!-- File Picker -->
            <label>File Picker:</label>
            <label class="file-upload">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                    fill="#ffffff">
                    <path
                        d="M252.31-180Q222-180 201-201q-21-21-21-51.31v-78.46q0-12.77 8.62-21.38 8.61-8.62 21.38-8.62t21.38 8.62q8.62 8.61 8.62 21.38v78.46q0 4.62 3.85 8.46 3.84 3.85 8.46 3.85h455.38q4.62 0 8.46-3.85 3.85-3.84 3.85-8.46v-78.46q0-12.77 8.62-21.38 8.61-8.62 21.38-8.62t21.38 8.62q8.62 8.61 8.62 21.38v78.46Q780-222 759-201q-21 21-51.31 21H252.31ZM450-664.46l-76.92 76.92q-8.93 8.92-21.19 8.81-12.27-.12-21.58-9.43-8.69-9.3-9-21.07-.31-11.77 9-21.08l124.38-124.38q5.62-5.62 11.85-7.92 6.23-2.31 13.46-2.31t13.46 2.31q6.23 2.3 11.85 7.92l124.38 124.38q8.92 8.92 8.81 20.89-.12 11.96-8.81 21.26-9.31 9.31-21.38 9.62-12.08.31-21.39-9L510-664.46v306q0 12.77-8.62 21.38-8.61 8.62-21.38 8.62t-21.38-8.62q-8.62-8.61-8.62-21.38v-306Z" />
                </svg>
                Choose File
                <input type="file">
            </label>
        </div>
        <div class="picker-container">

            <!-- Address Picker (Using Google Maps API) -->
            <label>Address Picker:</label>
            <input type="text" id="addressInput" class="custom-input" placeholder="Enter address...">
            <div id="suggestions"></div>
            <div id="map"></div>
        </div>
        <div class="picker-container">
            <label>Emoji Picker:</label>
            <div class="text-input-container">
                <input type="text" id="text-input" class="custom-input" placeholder="Enter your text" value="Hello ">
                <button id="emoji-toggle">😀</button>
            </div>
            <div id="emoji-grid" class="emoji-grid" style="display: none;">
                <button class="emoji-button">😀</button>
                <button class="emoji-button">😂</button>
                <button class="emoji-button">😍</button>
                <button class="emoji-button">🤔</button>
                <button class="emoji-button">😎</button>
                <button class="emoji-button">😊</button>
                <button class="emoji-button">😘</button>
                <button class="emoji-button">😜</button>
                <button class="emoji-button">😱</button>
                <button class="emoji-button">😈</button>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>

</html>
